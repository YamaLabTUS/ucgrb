[tool.poetry]
name = "ucgrb"
version = "7.0.0"
description = "Unit Commitment (UC) optimization for multi-area power systems connected by tie lines using Gurobi Optimizer."
authors = ["YamaLabTUS"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2.1"
openpyxl = "3.1.3" #表示くずれバグ防止のため、3.1.3で固定 (Fixed to 3.1.3 to prevent display corruption bug)
gurobipy = "^12.0.1"
pyyaml = "^6.0.1"


[tool.poetry.group.dev.dependencies]
spyder-kernels = "^3.0.1"
poethepoet = "^0.34.0"
black = "^25.1.0"
isort = "^6.0.0"
types-pyyaml = "^6.0.12.20250809"
pytest = "^8.0.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 98
include = '\.pyi?$'

[tool.isort]
profile = 'black'
line_length = 98

[tool.poe.tasks]
black = "black ./ucgrb"
isort = "isort ./ucgrb"
test = "pytest tests/ -v"
test-cov = "pytest tests/ --cov=ucgrb --cov-report=html --cov-report=term"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: 単体テスト",
    "integration: 統合テスト",
    "slow: 実行に時間がかかるテスト",
]
